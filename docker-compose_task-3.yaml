name: Spark-with-history
services:
  spark-master:
    image: apache/spark:latest
    user: root
    environment:
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - '8080:8080'
      - '7077:7077'
    volumes:
      - ./3_Spark_Basics/for_history:/opt/spark/history
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./3_Spark_Basics/data:/opt/spark/data
      - ./3_Spark_Basics/data_parquet:/opt/spark/data_parquet
      - ./3_Spark_Basics/output:/opt/spark/output
      - .:/opt/spark/workdir
    command:
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0

  spark-worker-1:
    image: apache/spark:latest
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=1
    volumes:
      - ./3_Spark_Basics/for_history:/opt/spark/history
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./3_Spark_Basics/data:/opt/spark/data
      - ./3_Spark_Basics/data_parquet:/opt/spark/data_parquet
      - ./3_Spark_Basics/output:/opt/spark/output
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-worker-2:
    image: apache/spark:latest
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./3_Spark_Basics/for_history:/opt/spark/history
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./3_Spark_Basics/data:/opt/spark/data
      - ./3_Spark_Basics/data_parquet:/opt/spark/data_parquet
      - ./3_Spark_Basics/output:/opt/spark/output
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-history-server:
    image: apache/spark:latest
    user: root
    depends_on:
      - spark-master
    ports:
      - '18080:18080'
    volumes:
      - ./3_Spark_Basics/for_history:/opt/spark/history
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer